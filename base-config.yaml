# Styling for the web view. Options:
#   1. Leave empty — uses the built-in system theme (auto light/dark via OS preference)
#   2. Import a named built-in theme (replace PLUGIN_URL with your plugin's base URL):
#        @import url("PLUGIN_URL/theme/dark.css");
#      Available themes: light, dark, catppuccin-light, catppuccin-dark,
#                        gruvbox, solarized-light, solarized-dark
#   3. Write raw CSS to override variables or add custom rules:
#        :root { --accent: #ff6b6b; }
css: ""
# Number of entries per page in journal mode
pagination: 10
# Maximum number of messages to backfill when publishing a room.
# Set to 0 to crawl the room's full history in the background (resumable across
# plugin restarts). The first batch lands quickly so the site is usable right away;
# the crawl then continues backward until the homeserver runs out of history.
max_backfill: 1000
# Events fetched per /messages request during backfill. Smaller values are gentler
# on the homeserver and let it interleave real traffic; larger values reduce
# round-trip overhead. Clamped to [1, 1000]. Default 50.
backfill_batch_size: 50
# Minimum power level required to publish/disable rooms (100 = room admin)
min_power_level: 100
# Minimum power level required to post top-level entries in journal rooms (ignored for chat rooms)
journal_author_pl: 50
# When true, hold new top-level journal posts as drafts until an author (meeting journal_author_pl)
# reacts to the post with the 📰 (newspaper) emoji. Enables draft/review workflows.
journal_emoji_publish: false
# When false, the bot will not warn or redact messages from non-authors in journal rooms.
# Authors still control publication via emoji reactions (if journal_emoji_publish is enabled).
journal_enforce_messages: true
# Minimum power level required to post top-level messages in chat rooms when
# chat_enforce_messages is enabled (threaded replies are always permitted).
chat_author_pl: 50
# When true, the bot redacts top-level chat messages from users below chat_author_pl
# (requires the bot to have redact permission in the room). Threaded replies bypass
# this check, letting lower-privileged users participate via threads. Default false.
chat_enforce_messages: false
# Base URL for the web interface (leave empty to auto-detect from maubot)
# Example: https://your.maubot.host/_matrix/maubot/plugin/your-instance-id
base_url: ""
# Optional raw HTML injected verbatim into every published page's <head>, as
# early as possible. Use for analytics / RUM snippets that must load before page
# content, or extra meta tags. Leave empty to disable. Can be overridden per-room
# via the room's org.jobmachine.webpublish.config state event.
# Example — Datadog RUM (v7 CDN async snippet); fill in your own ids/token/site:
#   head_html: |
#     <script>
#       (function(h,o,u,n,d){h=h[d]=h[d]||{q:[],onReady:function(c){h.q.push(c)}}
#       d=o.createElement(u);d.async=1;d.src=n,d.crossOrigin=''
#       n=o.getElementsByTagName(u)[0];n.parentNode.insertBefore(d,n)})
#       (window,document,'script','https://www.datadoghq-browser-agent.com/us1/v7/datadog-rum.js','DD_RUM')
#       window.DD_RUM.onReady(function(){window.DD_RUM.init({
#         applicationId:'YOUR_APP_ID', clientToken:'YOUR_CLIENT_TOKEN',
#         site:'datadoghq.com', service:'webpublish',
#         sessionSampleRate:100, sessionReplaySampleRate:0
#       })})
#     </script>
head_html: ""
# Optional raw HTML injected verbatim just before </body> on every published
# page. Use for deferred scripts or widgets. Leave empty to disable. Also
# overridable per-room via the config state event.
body_html: ""
